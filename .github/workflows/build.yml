name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch: # این خط اجازه میده دستی هم دکمه Run رو بزنی

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Make gradlew executable
        run: chmod +x ./gradlew

      - name: 3. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. Setup Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd /tmp
            curl -sSLo cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" || true
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "platform-tools" || true

      - name: 5. Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 6. Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/darmanagarno-release.jks
            echo "Keystore successfully decoded and saved."
          else
            echo "ERROR: KEYSTORE_BASE64 secret is empty!"
            exit 1
          fi

      - name: 7. Build Release APK
        env:
          DMN_STORE_PASSWORD: ${{ secrets.DMN_STORE_PASSWORD }}
          DMN_KEY_PASSWORD: ${{ secrets.DMN_KEY_PASSWORD }}
          DMN_KEY_ALIAS: ${{ secrets.DMN_KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: 8. Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Darmanagarno-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error # اگر APK ساخته نشه، کل بیلد رو قرمز میکنه تا متوجه بشیم
