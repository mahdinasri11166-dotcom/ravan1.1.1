name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "platform-tools"

      - name: Gradle wrapper executable
        run: chmod +x gradlew

      - name: Keystore from Secrets (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/darmanagarno-release.jks
            echo "Keystore written."
          else
            echo "No KEYSTORE_BASE64 secret; release will fall back to debug signing."
          fi

      - name: Unit tests (non-blocking)
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release
        env:
          DMN_STORE_PASSWORD: ${{ secrets.DMN_STORE_PASSWORD }}
          DMN_KEY_PASSWORD: ${{ secrets.DMN_KEY_PASSWORD }}
          DMN_KEY_ALIAS: ${{ secrets.DMN_KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Debug (fallback artifact)
        if: always()
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darmanagarno-release-v1.1.1
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.aab
          if-no-files-found: warn

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darmanagarno-debug-v1.1.1
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
